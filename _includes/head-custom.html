<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/interactives.css' | relative_url }}">
<script defer src="{{ '/assets/js/visualizations.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/interactives.js' | relative_url }}"></script>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script async id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  document.addEventListener("DOMContentLoaded", async () => {
    const blocks = document.querySelectorAll(
      "div.language-mermaid pre code, pre > code.language-mermaid"
    );

    for (const block of blocks) {
      const container = document.createElement("div");
      container.className = "mermaid";
      container.textContent = block.textContent;
      const wrapper = block.closest("div.language-mermaid") || block.parentElement;
      wrapper.replaceWith(container);
    }

    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "strict",
      theme: dark ? "dark" : "neutral"
    });

    await mermaid.run({ querySelector: ".mermaid" });
  });
</script>
