name: One-shot HTML-first migration

on:
  push:
    branches:
      - chore/html-first-migration-20260914

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/html-first-migration-20260914
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Markdown converter
        run: python -m pip install 'Markdown>=3.7,<4'

      - name: Convert public Markdown pages to HTML
        run: python scripts/migrate_public_markdown_to_html.py

      - name: Verify HTML-first state
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test ! -f index.md
          if find wiki -type f -name '*.md' -print -quit | grep -q .; then
            echo 'Public Markdown files remain under wiki/' >&2
            find wiki -type f -name '*.md' >&2
            exit 1
          fi
          if grep -RInE 'href=["'"'][^"'"']+\.md([?#][^"'"']*)?["'"']' index.html wiki --include='*.html'; then
            echo 'Local .md href remains in public HTML' >&2
            exit 1
          fi
          echo "HTML page count: $(find wiki -type f -name '*.html' | wc -l) + root index.html"

      - name: Remove one-shot migration helpers
        run: |
          rm -f scripts/migrate_public_markdown_to_html.py
          rm -f .github/workflows/html-first-migration.yml
          rmdir scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit migrated site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'refactor: migrate public pages from Markdown to HTML'
          git push origin HEAD:chore/html-first-migration-20260914
